name: Sync Rust API References

on:
  schedule:
    # Every 2 hours.
    # Rationale:
    #   - Facepunch ships game updates ~17:00-18:00 UTC (20-21 Kyiv/UTC+3);
    #     this schedule catches them within ≤2 h regardless of server timezone.
    #   - Oxide releases unpredictably, several times a month; 2-hour polling
    #     keeps the lag small without burning GitHub Actions minutes.
    #   - Fast-probe step (below) exits in ~30 s when nothing changed, so
    #     the expensive .NET / ILSpy install only runs on actual releases.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ── Fast probe ────────────────────────────────────────────────────────
      # Checks only API/metadata — no DLL downloads yet.
      # Exits early (changed=false) when neither Oxide tag nor Carbon asset
      # timestamp have moved, saving ~10-15 min of .NET + ILSpy setup.
      - name: Probe for new releases
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Oxide: compare latest release tag
          # Use authenticated requests to avoid the 60 req/h unauthenticated rate limit on
          # shared GitHub Actions IPs (unauthenticated → 403 → job fails in ~5 s).
          OXIDE_TAG=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/OxideMod/Oxide.Rust/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")

          OXIDE_PREV=$(grep '^oxide_version:' .hashes 2>/dev/null | cut -d: -f2- || echo "")

          # Carbon: compare Windows release asset updated_at timestamp
          CARBON_UPDATED=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/CarbonCommunity/Carbon/releases/tags/production_build" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assets = [a for a in d.get('assets', []) if 'Carbon.Windows.Release.zip' in a['name']]
          print(assets[0]['updated_at'] if assets else '')
          ")

          CARBON_PREV=$(grep '^carbon_updated:' .hashes 2>/dev/null | cut -d: -f2- || echo "")

          echo "oxide_tag=$OXIDE_TAG"           >> $GITHUB_OUTPUT
          echo "oxide_prev=$OXIDE_PREV"         >> $GITHUB_OUTPUT
          echo "carbon_updated=$CARBON_UPDATED" >> $GITHUB_OUTPUT
          echo "carbon_prev=$CARBON_PREV"       >> $GITHUB_OUTPUT

          OXIDE_NEW=false
          CARBON_NEW=false
          if [ "$OXIDE_TAG" != "$OXIDE_PREV" ]; then OXIDE_NEW=true; fi
          if [ "$CARBON_UPDATED" != "$CARBON_PREV" ]; then CARBON_NEW=true; fi

          echo "oxide_new=$OXIDE_NEW"   >> $GITHUB_OUTPUT
          echo "carbon_new=$CARBON_NEW" >> $GITHUB_OUTPUT

          if [ "$OXIDE_NEW" = "false" ] && [ "$CARBON_NEW" = "false" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "=== No changes — skipping decompile (Oxide $OXIDE_TAG, Carbon $CARBON_UPDATED) ==="
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "=== Changes detected ==="
            if [ "$OXIDE_NEW"  = "true" ]; then echo "  Oxide:  $OXIDE_PREV → $OXIDE_TAG"; fi
            if [ "$CARBON_NEW" = "true" ]; then echo "  Carbon: $CARBON_PREV → $CARBON_UPDATED"; fi
          fi

      # ── Everything below only runs when something actually changed ─────────

      - name: Setup .NET
        if: steps.probe.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install ILSpy CLI
        if: steps.probe.outputs.changed == 'true'
        run: dotnet tool install -g ilspycmd

      - name: Load previous SHA256 hashes
        if: steps.probe.outputs.changed == 'true'
        id: prev
        run: |
          echo "oxide_hash=$(grep  '^oxide:'  .hashes 2>/dev/null | cut -d: -f2 || echo '')" >> $GITHUB_OUTPUT
          echo "carbon_hash=$(grep '^carbon:' .hashes 2>/dev/null | cut -d: -f2 || echo '')" >> $GITHUB_OUTPUT

      - name: Download & decompile Oxide
        if: steps.probe.outputs.changed == 'true' && steps.probe.outputs.oxide_new == 'true'
        run: |
          URL="https://github.com/OxideMod/Oxide.Rust/releases/download/${{ steps.probe.outputs.oxide_tag }}/Oxide.Rust.zip"
          curl -fL "$URL" -o /tmp/Oxide.Rust.zip
          NEW_HASH=$(sha256sum /tmp/Oxide.Rust.zip | cut -d' ' -f1)
          echo "oxide_hash=$NEW_HASH" >> $GITHUB_ENV
          if [ "$NEW_HASH" = "${{ steps.prev.outputs.oxide_hash }}" ]; then
            echo "Oxide SHA256 unchanged — skipping decompile."
          else
            bash scripts/sync-oxide.sh /tmp/Oxide.Rust.zip
          fi

      - name: Download & decompile Carbon
        if: steps.probe.outputs.changed == 'true' && steps.probe.outputs.carbon_new == 'true'
        run: |
          curl -fL "https://github.com/CarbonCommunity/Carbon/releases/download/production_build/Carbon.Windows.Release.zip" \
               -o /tmp/Carbon.Windows.Release.zip
          NEW_HASH=$(sha256sum /tmp/Carbon.Windows.Release.zip | cut -d' ' -f1)
          echo "carbon_hash=$NEW_HASH" >> $GITHUB_ENV
          if [ "$NEW_HASH" = "${{ steps.prev.outputs.carbon_hash }}" ]; then
            echo "Carbon SHA256 unchanged — skipping decompile."
          else
            bash scripts/sync-carbon.sh /tmp/Carbon.Windows.Release.zip
          fi

      - name: Update .hashes
        if: steps.probe.outputs.changed == 'true'
        run: |
          # Carry forward unchanged hashes if only one side updated
          OXIDE_HASH="${oxide_hash:-${{ steps.prev.outputs.oxide_hash }}}"
          CARBON_HASH="${carbon_hash:-${{ steps.prev.outputs.carbon_hash }}}"

          cat > .hashes <<EOF
          oxide:${OXIDE_HASH}
          carbon:${CARBON_HASH}
          oxide_version:${{ steps.probe.outputs.oxide_tag }}
          carbon_updated:${{ steps.probe.outputs.carbon_updated }}
          updated:$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Check API compat (open Issue on breaking changes)
        if: steps.probe.outputs.changed == 'true'
        run: |
          if bash scripts/check-compat.sh; then
            echo "compat=ok" >> $GITHUB_ENV
          else
            echo "compat=broken" >> $GITHUB_ENV
          fi

      - name: Open GitHub Issue on breaking API changes
        if: env.compat == 'broken'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OXIDE_VER="${{ steps.probe.outputs.oxide_tag }}"
          COMPAT_OUTPUT=$(bash scripts/check-compat.sh 2>&1 || true)
          BODY="## ⚠️ Breaking API changes detected

          | | |
          |---|---|
          | Oxide | **${OXIDE_VER}** |
          | Carbon | production_build (updated ${{ steps.probe.outputs.carbon_updated }}) |

          One or more game/Oxide/Carbon symbols used by RustForge are missing from the decompiled refs after this sync.

          **Action required:** review the diff in this repo and update \`plugin/RustForgeCore.cs\` in the main project accordingly, then release a new version.

          <details><summary>Compat check output</summary>

          \`\`\`
          ${COMPAT_OUTPUT}
          \`\`\`

          </details>"
          gh issue create \
            --title "⚠️ Breaking API change — Oxide ${OXIDE_VER}" \
            --body "$BODY" \
            --label "breaking-change" \
            --repo "${{ github.repository }}" || true

      - name: Commit if changed
        if: steps.probe.outputs.changed == 'true'
        run: |
          git config user.name  "rust-api-bot"
          git config user.email "bot@rustforge.cloud"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit (hashes matched — decompile skipped)."
          else
            MSG="sync: Oxide ${{ steps.probe.outputs.oxide_tag }}"
            if [ "${{ steps.probe.outputs.carbon_new }}" = "true" ]; then MSG="$MSG / Carbon $(date +%Y-%m-%d)"; fi
            git commit -m "$MSG"
            git pull --rebase origin main
            git push
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          PLATFORM_DISCORD_WEBHOOK: ${{ secrets.PLATFORM_DISCORD_WEBHOOK }}
        run: |
          if [ -z "$PLATFORM_DISCORD_WEBHOOK" ]; then
            echo "PLATFORM_DISCORD_WEBHOOK not set — skipping Discord notification."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HTTP_STATUS=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Sync Rust API References провалився\",\"description\":\"Автоматичний синк Oxide/Carbon refs впав.\\n[Відкрити лог]($RUN_URL)\",\"color\":15158332}]}" \
            "$PLATFORM_DISCORD_WEBHOOK")
          echo "Discord HTTP status: $HTTP_STATUS"
          cat /tmp/discord_resp.txt || true
          if [ "$HTTP_STATUS" != "204" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "WARNING: Discord webhook returned $HTTP_STATUS — check PLATFORM_DISCORD_WEBHOOK secret"
          fi
